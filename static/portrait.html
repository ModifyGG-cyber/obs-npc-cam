<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OBS NPC Cam portrait</title>
<!-- OBS NPC Cam loads this page in an OBS Browser source: ?img=<image address>&name=<caption> -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #frame { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #portrait { width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.6s ease; }
  #portrait.shown { opacity: 1; }
  #name {
    margin: 0 0 4vh; padding: 0.4em 1.2em; font: 600 5vh/1.2 Georgia, "Times New Roman", serif; color: #f4ecd8;
    background: rgba(0, 0, 0, 0.55); border-radius: 0.3em; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity 0.6s ease 0.2s;
  }
  #name.shown { opacity: 1; }
  #name:empty { display: none; }
</style>
</head>
<body>
<div id="frame"><img id="portrait" alt=""></div>
<p id="name"></p>
<script>
  const params = new URLSearchParams(location.search);
  const img = document.getElementById('portrait');
  const name = document.getElementById('name');
  const src = params.get('img');
  name.textContent = params.get('name') || '';
  if (src) {
    img.addEventListener('load', () => { img.classList.add('shown'); name.classList.add('shown'); });
    img.src = src;
  }
</script>
</body>
</html>
