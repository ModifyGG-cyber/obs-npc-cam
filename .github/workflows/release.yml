name: Release
on:
  push:
    tags: ['v*']
  # Run by hand from the Actions tab: tags the current main with the version in module.json and releases it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run all
      - id: version
        run: echo "tag=v$(node -p "require('./module.json').version")" >> "$GITHUB_OUTPUT"
      - run: cd dist/obs-npc-cam && zip -r ../obs-npc-cam.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/obs-npc-cam.zip
            dist/obs-npc-cam/module.json
